name: Deploy Nutritracker Backend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/root/nutri-tracker-mobile"
            fi

            BACKEND_DIR="$APP_DIR/backend_api"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all
            git checkout "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"

            cd "$BACKEND_DIR"

            {
              echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}"
              echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}"
              echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
              echo "API_HOST=${{ secrets.API_HOST }}"
              echo "API_PORT=${{ secrets.API_PORT }}"

              if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
                echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
              fi
              if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
                echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
              fi
              if [ -n "${{ secrets.OPENAI_MODEL }}" ]; then
                echo "OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}"
              else
                echo "OPENAI_MODEL=gpt-4.1-mini"
              fi
            } > .env

            for var_name in POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD; do
              if ! grep -q "^${var_name}=" .env; then
                echo "❌ Missing ${var_name} in generated .env"
                exit 1
              fi
            done

            API_PORT_VALUE="$(grep '^API_PORT=' .env | cut -d'=' -f2-)"
            if [ -z "${API_PORT_VALUE}" ]; then
              API_PORT_VALUE="8090"
              echo "API_PORT=${API_PORT_VALUE}" >> .env
            fi

            docker compose down --remove-orphans || true
            if ! docker compose up -d --build; then
              echo "❌ docker compose up failed. Showing diagnostics."
              docker compose ps || true
              docker compose logs --tail=300 api || true
              exit 1
            fi

            echo "⏳ Waiting for container state"
            RUNNING_OK="0"
            for i in $(seq 1 60); do
              CID="$(docker compose ps -q api)"
              if [ -z "$CID" ]; then
                CONTAINER_STATE="missing"
                RESTART_COUNT="0"
              else
                CONTAINER_STATE="$(docker inspect --format='{{.State.Status}}' "$CID" 2>/dev/null || true)"
                RESTART_COUNT_RAW="$(docker inspect --format='{{.RestartCount}}' "$CID" 2>/dev/null || true)"

                if [ -z "$CONTAINER_STATE" ]; then
                  CONTAINER_STATE="missing"
                fi

                if [[ "$RESTART_COUNT_RAW" =~ ^[0-9]+$ ]]; then
                  RESTART_COUNT="$RESTART_COUNT_RAW"
                else
                  RESTART_COUNT="0"
                fi
              fi

              echo "container state: ${CONTAINER_STATE}, restarts: ${RESTART_COUNT}"

              if (( RESTART_COUNT >= 3 )); then
                echo "❌ Container unstable (too many restarts). Showing logs."
                docker compose ps || true
                docker compose logs --tail=200 api || true
                exit 1
              fi

              if [ "${CONTAINER_STATE}" = "running" ]; then
                RUNNING_OK="1"
                break
              fi

              sleep 5
            done

            if [ "$RUNNING_OK" != "1" ]; then
              echo "❌ API container did not reach running state in time"
              docker compose ps || true
              docker compose logs --tail=200 api || true
              exit 1
            fi

            echo "⏳ Waiting for app on http://127.0.0.1:${API_PORT_VALUE}/health"
            for i in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:${API_PORT_VALUE}/health" >/dev/null; then
                echo "✅ App is reachable on port ${API_PORT_VALUE}"
                exit 0
              fi
              sleep 5
            done

            echo "❌ App did not become ready on port ${API_PORT_VALUE}"
            docker compose ps || true
            docker compose logs --tail=200 api || true
            exit 1
