name: Deploy Nutritracker Backend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/root/nutri-tracker-mobile"
            fi

            BACKEND_DIR="$APP_DIR/backend_api"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all
            git checkout "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"

            cd "$BACKEND_DIR"

            {
              echo "DB_HOST=${{ secrets.DB_HOST }}"
              echo "DB_PORT=${{ secrets.DB_PORT }}"
              echo "DB_NAME=${{ secrets.DB_NAME }}"
              echo "DB_USER=${{ secrets.DB_USER }}"
              echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"

              echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}"
              echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}"
              echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"

              echo "API_HOST=${{ secrets.API_HOST }}"
              echo "API_PORT=${{ secrets.API_PORT }}"

              if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
                echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
              fi
              if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
                echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
              fi
              if [ -n "${{ secrets.OPENAI_MODEL }}" ]; then
                echo "OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}"
              else
                echo "OPENAI_MODEL=gpt-4.1-mini"
              fi
            } > .env

            DB_HOST_VALUE="$(grep '^DB_HOST=' .env | cut -d'=' -f2-)"
            DB_PORT_VALUE="$(grep '^DB_PORT=' .env | cut -d'=' -f2-)"
            DB_NAME_VALUE="$(grep '^DB_NAME=' .env | cut -d'=' -f2-)"
            DB_USER_VALUE="$(grep '^DB_USER=' .env | cut -d'=' -f2-)"
            DB_PASSWORD_VALUE="$(grep '^DB_PASSWORD=' .env | cut -d'=' -f2-)"

            if [ -z "${DB_HOST_VALUE}" ]; then
              DB_HOST_VALUE="$(grep '^POSTGRES_HOST=' .env | cut -d'=' -f2-)"
            fi
            if [ -z "${DB_PORT_VALUE}" ]; then
              DB_PORT_VALUE="$(grep '^POSTGRES_PORT=' .env | cut -d'=' -f2-)"
            fi
            if [ -z "${DB_NAME_VALUE}" ]; then
              DB_NAME_VALUE="$(grep '^POSTGRES_DB=' .env | cut -d'=' -f2-)"
            fi
            if [ -z "${DB_USER_VALUE}" ]; then
              DB_USER_VALUE="$(grep '^POSTGRES_USER=' .env | cut -d'=' -f2-)"
            fi
            if [ -z "${DB_PASSWORD_VALUE}" ]; then
              DB_PASSWORD_VALUE="$(grep '^POSTGRES_PASSWORD=' .env | cut -d'=' -f2-)"
            fi

            if [ -z "${DB_HOST_VALUE}" ] || [ -z "${DB_PORT_VALUE}" ] || [ -z "${DB_NAME_VALUE}" ] || [ -z "${DB_USER_VALUE}" ] || [ -z "${DB_PASSWORD_VALUE}" ]; then
              echo "❌ Missing DB connection values (DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD)"
              exit 1
            fi

            echo "DATABASE_URL=postgresql+psycopg://${DB_USER_VALUE}:${DB_PASSWORD_VALUE}@${DB_HOST_VALUE}:${DB_PORT_VALUE}/${DB_NAME_VALUE}" >> .env

            for var_name in DATABASE_URL; do
              if ! grep -q "^${var_name}=" .env; then
                echo "❌ Missing ${var_name} in generated .env"
                exit 1
              fi
            done

            API_PORT_VALUE="$(grep '^API_PORT=' .env | cut -d'=' -f2-)"
            if [ -z "${API_PORT_VALUE}" ]; then
              API_PORT_VALUE="8090"
              echo "API_PORT=${API_PORT_VALUE}" >> .env
            fi

            docker compose down --remove-orphans || true
            if ! docker compose up -d --build; then
              echo "❌ docker compose up failed. Showing diagnostics."
              docker compose ps || true
              docker compose logs --tail=300 api || true
              exit 1
            fi

            echo "⏳ Checking API container presence"
            CID="$(docker compose ps -q api 2>/dev/null || true)"
            if [ -z "$CID" ]; then
              echo "❌ API container not found after docker compose up"
              docker compose ps || true
              docker compose logs --tail=200 api || true
              exit 1
            fi

            echo "⏳ Waiting for app on http://127.0.0.1:${API_PORT_VALUE}/health"
            ATTEMPT=1
            while [ "$ATTEMPT" -le 60 ]; do
              API_STATE="$(docker inspect --format='{{.State.Status}}' "$CID" 2>/dev/null || true)"
              API_RESTARTS="$(docker inspect --format='{{.RestartCount}}' "$CID" 2>/dev/null || true)"
              echo "health attempt ${ATTEMPT}/60 - state: ${API_STATE:-unknown}, restarts: ${API_RESTARTS:-0}"

              if curl -fsS "http://127.0.0.1:${API_PORT_VALUE}/health" >/dev/null; then
                echo "✅ App is reachable on port ${API_PORT_VALUE}"
                exit 0
              fi

              if [ "${API_STATE}" = "exited" ] || [ "${API_STATE}" = "dead" ]; then
                echo "❌ API container is not running (state=${API_STATE})"
                docker compose ps || true
                docker compose logs --tail=200 api || true
                exit 1
              fi

              sleep 5
              ATTEMPT=$((ATTEMPT + 1))
            done

            echo "❌ App did not become ready on port ${API_PORT_VALUE}"
            docker compose ps || true
            docker compose logs --tail=200 api || true
            exit 1
