name: Deploy Google Play Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (internal, alpha, beta, production)"
        required: true
        default: "production"
      first_deploy:
        description: "First deployment (enforce metadata + compliance ack)"
        required: true
        default: "false"
      release_status:
        description: "Release status"
        required: true
        default: "completed"
      rollout_percentage:
        description: "Rollout percentage (1-100)"
        required: true
        default: "100"

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: google-play-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install MAUI Android workload
        run: |
          dotnet --version
          dotnet workload install maui-android --ignore-failed-sources
          dotnet workload restore NutritionTracker.csproj --ignore-failed-sources

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-google-play.txt

      - name: Prepare Android keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android-release.jks

      - name: Verify signing certificate fingerprint
        env:
          ANDROID_SIGNING_STORE_PASS: ${{ secrets.ANDROID_SIGNING_STORE_PASS }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASS: ${{ secrets.ANDROID_SIGNING_KEY_PASS }}
        run: |
          STORE_PASS="$(printf '%s' "$ANDROID_SIGNING_STORE_PASS" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$ANDROID_SIGNING_KEY_ALIAS" | tr -d '\r\n')"
          KEY_PASS_RAW="$(printf '%s' "$ANDROID_SIGNING_KEY_PASS" | tr -d '\r\n')"

          KEYSTORE_TYPE="$(keytool -list -keystore android-release.jks -storepass "$STORE_PASS" 2>/dev/null | sed -n 's/^Keystore type: //p' | head -n1 | tr -d '\r\n')"
          EFFECTIVE_KEY_PASS="$KEY_PASS_RAW"
          if [[ "${KEYSTORE_TYPE^^}" == "PKCS12" ]]; then
            EFFECTIVE_KEY_PASS="$STORE_PASS"
          fi

          if ! keytool -list -v -keystore android-release.jks -storepass "$STORE_PASS" -alias "$KEY_ALIAS" -keypass "$EFFECTIVE_KEY_PASS" > keytool-cert.txt 2>&1; then
            echo "[ERROR] Unable to read signing cert fingerprint for alias '$KEY_ALIAS'."
            cat keytool-cert.txt
            exit 1
          fi

          echo "[INFO] Signing key alias: $KEY_ALIAS"
          echo "[INFO] Certificate fingerprints:"
          grep -E "SHA256:|SHA1:" keytool-cert.txt | sed 's/^/  /'

      - name: Prepare Google service account
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_B64" | base64 -d > google-play-service-account.json

      - name: Deploy to Google Play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ github.workspace }}/google-play-service-account.json
          GOOGLE_PLAY_PACKAGE_NAME: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME || 'com.audela.nutritiontracker' }}
          GOOGLE_PLAY_TRACK: ${{ github.event_name == 'push' && 'production' || github.event.inputs.track }}
          GOOGLE_PLAY_RELEASE_STATUS: ${{ github.event_name == 'push' && 'completed' || github.event.inputs.release_status }}
          GOOGLE_PLAY_ROLLOUT_PERCENTAGE: ${{ github.event_name == 'push' && '100' || github.event.inputs.rollout_percentage }}
          GOOGLE_PLAY_AUTO_BUMP_VERSION: "true"
          GOOGLE_PLAY_DEFAULT_LANGUAGE: 'en-US'
          GOOGLE_PLAY_ADDITIONAL_LANGUAGES: ${{ vars.GOOGLE_PLAY_ADDITIONAL_LANGUAGES || 'fr-FR' }}
          GOOGLE_PLAY_LISTING_TITLE: ${{ vars.GOOGLE_PLAY_LISTING_TITLE || 'NutritionTracker' }}
          GOOGLE_PLAY_SHORT_DESCRIPTION: ${{ vars.GOOGLE_PLAY_SHORT_DESCRIPTION || 'Track calories, protein, carbs and daily activity.' }}
          GOOGLE_PLAY_FULL_DESCRIPTION: ${{ vars.GOOGLE_PLAY_FULL_DESCRIPTION || 'NutritionTracker helps you track meals (text/photo), nutrition goals, and daily activity with actionable insights and personalized recommendations.' }}
          GOOGLE_PLAY_PRIVACY_POLICY_URL: ${{ vars.GOOGLE_PLAY_PRIVACY_POLICY_URL || 'https://www.audeladedonnees.fr/legal/privacy' }}
          GOOGLE_PLAY_AUTO_GENERATE_ASSETS: "true"
          GOOGLE_PLAY_ASSETS_APP_TITLE: ${{ vars.GOOGLE_PLAY_ASSETS_APP_TITLE || 'NutritionTracker' }}
          GOOGLE_PLAY_ASSETS_SUBTITLE: ${{ vars.GOOGLE_PLAY_ASSETS_SUBTITLE || 'Nutrition and activity tracking' }}
          GOOGLE_PLAY_ASSETS_STYLE: ${{ vars.GOOGLE_PLAY_ASSETS_STYLE || 'marketing' }}
          GOOGLE_PLAY_FIRST_DEPLOY: ${{ github.event.inputs.first_deploy }}
          GOOGLE_PLAY_ACK_MANUAL_COMPLIANCE: "true"
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/android-release.jks
          ANDROID_SIGNING_STORE_PASS: ${{ secrets.ANDROID_SIGNING_STORE_PASS }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASS: ${{ secrets.ANDROID_SIGNING_KEY_PASS }}
        run: |
          export ANDROID_SIGNING_STORE_PASS="$(printf '%s' "$ANDROID_SIGNING_STORE_PASS" | tr -d '\r\n')"
          export ANDROID_SIGNING_KEY_ALIAS="$(printf '%s' "$ANDROID_SIGNING_KEY_ALIAS" | tr -d '\r\n')"
          export ANDROID_SIGNING_KEY_PASS="$(printf '%s' "$ANDROID_SIGNING_KEY_PASS" | tr -d '\r\n')"
          chmod +x scripts/deploy_google_play.sh
          ./scripts/deploy_google_play.sh
