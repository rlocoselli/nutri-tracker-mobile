services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-nutritiontracker}
      DB_USER: ${DB_USER:-nutrition_user}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${DB_USER:-nutrition_user}:${DB_PASSWORD:-change-me}@${DB_HOST:-127.0.0.1}:${DB_PORT:-5432}/${DB_NAME:-nutritiontracker}}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8090}
    ports:
      - "${API_PORT:-8090}:${API_PORT:-8090}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${API_PORT:-8090}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
